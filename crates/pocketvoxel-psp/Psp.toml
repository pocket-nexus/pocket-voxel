# cargo-psp reads this for the PBP metadata. tools/voxel.ts re-packs the
# PARAM.SFO afterwards with MEMSIZE=1 (cargo-psp has no field for it) so
# PPSSPP/CFW-slim grant the full 64 MB — the 21 MB pak needs it.
#
# The keys sit at the top level: cargo-psp deserializes the whole file as its
# config and ignores a table, so under a `[psp]` header it packed no title,
# no icon and no background.
title = "VOXELMON"
# XMB art. The icon is the Pocket3D app icon, read from the PocketJS checkout:
# this repository keeps no icon of its own. The background is the game's own
# picture, a device capture of Pallet Town as the diorama renders it on
# hardware. tools/voxel.ts passes the same two files to its pack-pbp repack.
xmb_icon_png = "../../vendor/pocketjs/engine/pocket3d/icon/psp/ICON0.PNG"
xmb_background_png = "assets/PIC1.png"
